<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Matches the header mark in index.html: a curving road with one vehicle on
       it. `prefers-color-scheme` works inside an SVG favicon in browsers that
       support SVG icons, so the mark stays legible on either tab-bar colour. -->
  <style>
    .road { stroke: #b45309; }
    .car  { fill:   #b45309; }
    @media (prefers-color-scheme: dark) {
      .road { stroke: #f0a955; }
      .car  { fill:   #f0a955; }
    }
  </style>
  <path class="road" d="M4 28C4 16 13 6 29 6" fill="none" stroke-width="8" stroke-linecap="round" opacity=".18"/>
  <path class="road" d="M4 28C4 16 13 6 29 6" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 4" opacity=".5"/>
  <circle class="car" cx="14.9" cy="9.3" r="3"/>
</svg>
